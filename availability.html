<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Availability · ShiftSync</title>
  <!-- Inter font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<!-- "checking-login" hides the page until we know who is logged in (js/auth.js) -->
<body class="checking-login">
  <!-- The nav bar is drawn here by js/layout.js -->
  <nav id="top-nav" class="top-nav" aria-label="Main"></nav>

  <main class="page">
    <header class="page-header">
      <h1>My availability</h1>
      <p>Pick a mode, then click or drag across the grid to mark your week.</p>
    </header>

    <div class="availability-layout">
      <!-- Side panel: mode toggle, legend, and buttons -->
      <aside class="card side-panel">
        <h2>Paint mode</h2>
        <div class="mode-toggle" role="group" aria-label="Paint mode">
          <button type="button" class="mode-button" data-mode="preferred">
            <span class="swatch swatch-preferred" aria-hidden="true"></span>
            Preferred
          </button>
          <button type="button" class="mode-button" data-mode="conflict">
            <span class="swatch swatch-conflict" aria-hidden="true"></span>
            Definite conflict
          </button>
        </div>

        <h2>Legend</h2>
        <ul class="legend">
          <li><span class="swatch swatch-preferred" aria-hidden="true"></span> Preferred time</li>
          <li><span class="swatch swatch-conflict" aria-hidden="true"></span> Definite conflict (can't work)</li>
          <li><span class="swatch swatch-free" aria-hidden="true"></span> Free, can work if needed</li>
        </ul>

        <p class="hint">Tip: click a colored slot again to clear it.</p>

        <div class="actions">
          <button type="button" id="save" class="button button-primary">Save availability</button>
          <button type="button" id="clear-all" class="button button-secondary">Clear all</button>
          <!-- aria-live makes screen readers announce messages like "Saved ✓" -->
          <p id="save-status" class="status" aria-live="polite"></p>
        </div>
      </aside>

      <!-- The weekly grid is drawn here by js/grid.js -->
      <section class="card grid-card">
        <div id="availability-grid"></div>
      </section>
    </div>
  </main>

  <!-- The footer is drawn here by js/layout.js -->
  <footer id="site-footer" class="site-footer"></footer>

  <!-- type="module" lets our JS files import from each other -->
  <script type="module" src="js/availability.js"></script>
</body>
</html>
